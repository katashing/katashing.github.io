<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="学校申请跟踪：已选与备选学校、进度、日期、备注、翰岭院出行时间。">
  <title>学校申请跟踪</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261011-compact-progress-v3">
  <script src="schools.js?v=20261011-compact-progress-v3" defer></script>
  <script src="travel-data.js?v=20261011-compact-progress-v3" defer></script>
  <script src="transit-data.js?v=20261011-compact-progress-v3" defer></script>
  <script src="travel.js?v=20261011-compact-progress-v3" defer></script>
  <script src="schedule-checks.js?v=20261011-compact-progress-v3" defer></script>
  <script src="app.js?v=20261011-compact-progress-v3" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-icon" aria-hidden="true">学</span><span>学校申请跟踪<small> 小三插班 · 2026—2027</small></span></a>
  </header>
  <main>
    <section class="workspace" aria-label="学校清单">
      <nav class="tabs" aria-label="学校表页"><button data-scope="selected" class="active" aria-pressed="true">已选学校 <span id="tab-selected-count">7</span></button><button data-scope="candidates" aria-pressed="false">备选学校 <span id="tab-candidate-count">24</span></button></nav>
      <div class="filters">
        <label class="search"><span class="sr-only">搜索学校或备注</span><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索学校或备注…"></label>
        <label><span class="sr-only">地区</span><select id="region"><option value="">全部地区</option><option>北区</option><option>大埔</option><option>沙田</option><option>深圳</option></select></label>
        <label><span class="sr-only">梯队</span><select id="tier"><option value="">全部梯队</option><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option><option value="none">未列梯队</option></select></label>
        <label><span class="sr-only">申请状态</span><select id="status"><option value="">全部状态</option></select></label>
        <label><span class="sr-only">排序</span><select id="sort"><option value="default">默认顺序</option><option value="followup">跟进日期</option><option value="deadline">截止日期</option><option value="commute">公共交通时间</option></select></label>
      </div>
      <div id="travel-settings" class="travel-settings" hidden></div>
      <div class="list-note"><span id="result-count"></span><div><button id="csv-button" class="text-button">导出 CSV</button><button id="print-button" class="text-button">打印</button></div></div>
      <div class="table-wrap"><table><colgroup><col class="school-col"><col class="region-col"><col class="tier-col"><col class="intro-col"><col class="date-col"><col class="progress-col"><col class="teacher-route-col"><col class="travel-col"></colgroup><thead><tr><th>学校</th><th>地区</th><th>梯队</th><th class="intro-head">学校介绍</th><th>重要日期</th><th>报名进度<small>下次跟进</small></th><th class="teacher-route-head">老师路程（原文）</th><th id="travel-head">翰岭院出行<small>单程总时间</small></th></tr></thead><tbody id="school-list"></tbody></table></div>
      <div id="empty-state" class="empty-state" hidden><strong>没有符合条件的学校</strong><button id="clear-filters" class="button">清除筛选</button></div>
    </section>
    <details class="sources"><summary>资料来源</summary>
      <div class="source-grid"><div class="source-copy"><p>老师的学校介绍和路程原文直接列在表格中。报名、笔试日期以学校通知为准；红色问题提示保留现有日期。</p><div id="travel-source-notes"></div></div><div class="source-links"><a href="assets/taipo.png" target="_blank" rel="noopener">大埔学校资料 ↗</a><a href="assets/north.png" target="_blank" rel="noopener">北区学校资料 ↗</a></div></div>
    </details>
  </main>
  <dialog id="detail-dialog" class="detail-dialog">
    <div class="dialog-head"><div><p class="eyebrow" id="detail-subtitle"></p><h2 id="detail-title"></h2></div><button class="close-button" type="button" data-close="detail-dialog" aria-label="关闭学校详情">×</button></div>
    <div class="dialog-body"><section id="detail-facts" class="fact-box"></section></div>
    <div class="dialog-footer"><button type="button" class="button" data-close="detail-dialog">关闭</button></div>
  </dialog>
</body>
</html>
