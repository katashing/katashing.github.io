<head>

<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000}
body{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;line-height:1.4}
.all-board{max-width:600px;margin:0 auto;padding:10px 16px 24px}
button,select,.top-nav a{font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:0;min-height:48px}
button{cursor:pointer}button:focus,select:focus,a:focus{outline:3px solid #000;outline-offset:2px}
button.selected,.top-nav a.selected{color:#fff;background:#000}
.top-nav{display:table;table-layout:fixed;width:100%;border-spacing:4px 0;margin:0 0 14px}
.top-nav div{display:table-cell;vertical-align:top}.top-nav .back-cell{width:46%}
.top-nav a{display:block;text-decoration:none;text-align:center;padding:9px 3px;font-size:19px}
h1{font-size:28px;line-height:1.2;margin:0 0 12px}h2{font-size:25px;line-height:1.3;margin:16px 0 9px}

.sections div{display:table-cell;vertical-align:top}.sections button{width:100%;padding:7px 3px;font-size:20px;line-height:1.3}

.meal-photo img{display:block;width:100%;height:auto;margin:0 auto}
.meal-crop{display:block;position:absolute;top:0;height:0;overflow:hidden}
.meal-photo .meal-crop img{display:block;position:absolute;top:0;max-width:none;height:auto;margin:0}

.all-board.menu-view{padding-bottom:88px}.menu-view .top-nav{margin-bottom:9px}.menu-view h1{font-family:Georgia,"Songti SC","STSong",SimSun,serif;font-size:30px;line-height:1.2;margin-bottom:10px}.menu-view .sections{margin-bottom:8px}

.time{display:table-cell;vertical-align:top;width:134px;font-size:19px;line-height:1.6;white-space:nowrap}

.sample{display:inline-block;font-size:15px;margin-left:8px;white-space:nowrap}.entry-date{font-size:16px;line-height:1.4;margin-top:5px}
.scope{font-size:17px;line-height:1.4;margin:6px 0 10px}
.week-days{display:table;table-layout:fixed;border-spacing:4px 0;width:100%;margin:10px 0 7px}.week-days div{display:table-cell}.week-days button{width:100%;font-size:22px;padding:3px 0}
.week-nav{overflow:hidden;margin:8px 0}.week-nav button{font-size:17px;min-height:38px;padding:3px 12px}.week-prev{float:left}.week-next{float:right}
.selected-date{font-size:20px;margin:7px 0 10px;text-align:center}.day-note{font-size:22px;font-weight:bold;margin:10px 0}
.empty{font-size:21px;line-height:1.5;margin:10px 0;padding:8px 0}.pager{text-align:center;font-size:16px;margin:12px 0 4px}
.more{display:block;width:100%;font-size:21px;margin-top:10px;padding:7px 4px}
.menu-pager{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;padding:8px 12px;background:#fff;border-top:1px solid #000;z-index:10}.menu-pager-row{display:table;table-layout:fixed;width:100%;border-spacing:5px 0}.menu-pager-row>div{display:table-cell;vertical-align:middle}.menu-page-control{width:38%}.menu-page-count{width:24%;font-size:19px;text-align:center;white-space:nowrap}.menu-pager button{display:block;width:100%;min-height:48px;font-size:21px;padding:8px 3px}.menu-pager button:disabled{color:#888;border-color:#aaa;background:#fff;cursor:default}.menu-pager button:disabled:before{opacity:.35}

.menu-view .meal-menu,.menu-view .meal-pair{display:block;width:100%}.menu-view .meal-row{display:table;table-layout:fixed;width:100%;padding:8px 0}.menu-view .meal-description{display:table-cell;width:30%;vertical-align:middle;padding-right:12px;text-align:left}.menu-view .meal-photo{display:table-cell;width:70%;max-width:none;vertical-align:middle;margin:0;text-align:left}.menu-view .meal-image-box{width:100%;max-width:350px;margin-left:auto}.menu-view .meal-name,html[lang="en"] .menu-view .meal-name{font-size:28px;line-height:1.3}.menu-view .meal-row.no-photo .meal-description{width:100%;padding-right:0}

.menu-view .meal-description{width:68%;padding-right:12px}.menu-view .meal-photo{width:32%}.menu-view .meal-image-box{max-width:150px}.menu-view .meal-row{min-height:88px;padding:7px 0}.menu-view .meal-name,html[lang="en"] .menu-view .meal-name{font-size:26px}.menu-view .meal-description .detail{font-size:18px;margin-top:3px}.meal-drinks{font-size:17px;line-height:1.25;margin:0 0 7px}.menu-view h1{font-size:26px;margin-bottom:8px}.menu-view .top-nav{margin-bottom:8px}.menu-view .sections{margin-bottom:8px}.household-reference{margin-top:18px}.reference-group{margin:8px 0}.reference-toggle{display:block;width:100%;text-align:left;padding:8px 12px;font-size:21px}.household-day,.household-reference{font-family:"Menu Handwriting","Kaiti SC",KaiTi,serif}html[lang="en"] .household-day,html[lang="en"] .household-reference{font-family:"Menu English",Georgia,serif}.reference-toggle{font-family:Arial,"PingFang SC",sans-serif}
